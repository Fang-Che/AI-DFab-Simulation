<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><style>

const scene=new T.Scene();scene.background=new T.Color('#f4f7f8');const host=$('view'),renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));host.appendChild(renderer.domElement);

const route=D.route.map(mm),half=mm(D.target.bbox_mm[1]).sub(mm(D.target.bbox_mm[0])).multiplyScalar(.5);
const normal='#4d94a3',red='#c74e47';function mat(color,alpha=1){return new T.MeshStandardMaterial({color,transparent:alpha<1,opacity:alpha,roughness:.8,side:T.DoubleSide})}
const obstacles=D.obstacles.map(o=>{const lo=mm(o.bbox_mm[0]),hi=mm(o.bbox_mm[1]),size=hi.clone().sub(lo);const mesh=new T.Mesh(new T.BoxGeometry(size.x,size.y,size.z),mat('#c9d3d5',.65));mesh.position.copy(lo.clone().add(hi).multiplyScalar(.5));mesh.add(new T.LineSegments(new T.EdgesGeometry(mesh.geometry),new T.LineBasicMaterial({color:'#9aafb5',transparent:true,opacity:.45})));scene.add(mesh);return {id:o.instance_id,lo,hi,mesh}});
const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(D.vertices.map(v=>mm(v).sub(mm(D.center)).toArray()).flat(),3));g.setIndex(D.faces.flat());g.computeVertexNormals();const moving=new T.Mesh(g,mat(normal));moving.add(new T.LineSegments(new T.EdgesGeometry(g,28),new T.LineBasicMaterial({color:'#285b66'})));scene.add(moving);

line(route,'#659fba');const ground=new T.GridHelper(40,40,'#b7c8cd','#e1e8eb');ground.rotation.x=Math.PI/2;scene.add(ground);
const bounds=new T.Box3();for(const o of obstacles){bounds.expandByPoint(o.lo);bounds.expandByPoint(o.hi)}for(const p of route)bounds.expandByPoint(p);const mid=bounds.getCenter(new T.Vector3()),extent=bounds.getSize(new T.Vector3()).length();controls.target.copy(mid);camera.position.copy(mid).add(new T.Vector3(-extent*.75,-extent*.8,extent*.65));controls.update();
const mast=mm(D.crane),height=Math.max(...route.map(v=>v.z+half.z))+1.2;line([mast,new T.Vector3(mast.x,mast.y,height)],'#748c97');const boom=line([new T.Vector3(mast.x,mast.y,height),new T.Vector3(0,0,height)],'#748c97');const hook=line([new T.Vector3(),new T.Vector3()],'#748c97');
const lens=route.slice(1).map((v,i)=>v.distanceTo(route[i])),total=lens.reduce((a,b)=>a+b,0);let progress=0,playing=false,last=0,pending=false;
function pathAt(p){let left=p*total;for(let i=0;i<lens.length;i++){if(left<=lens[i]&&lens[i]>0)return route[i].clone().lerp(route[i+1],left/lens[i]);left-=lens[i]}return route.at(-1).clone()}
